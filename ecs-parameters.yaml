environment:
  name: sparrowx

service:
  name: billing-api
  stack: sparrowx-billing-api

image:
  repository: billing-api

container:
  port: 8000
  cpu: 256
  memory: 512

deployment:
  desiredCount: 1

loadBalancer:
  pathPattern: /api/billing/*
  listenerRulePriority: 130
  healthCheckPath: /health

database:
  enabled: true
  stack: sparrowx-database
  endpoint: ''
  port: 5432
  name: billingdb
  outputs:
    endpoint: BillingDatabaseEndpoint
    port: BillingDatabasePort
    secret_arn: BillingDatabaseSecretArn
    security_group_id: BillingDatabaseSecurityGroupId
